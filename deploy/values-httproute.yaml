# dial-extension 3.1.1 — Gateway API HTTPRoute.
# Do not enable ingress in the same release.
# Three Exact matches only. Core keeps every other route on this host.

image:
  registry: ghcr.io
  repository: sergey-zinchenko/openai-dial-proxy
  tag: "0.1.0"
  digest: sha256:16a4fa74172ee742dd3ea8d1b5be412988495e73a68d70c4c7889792b903b4ad
  pullPolicy: IfNotPresent
  # Required while the GHCR package is private. Remove after you make it public.
  pullSecrets:
    - ghcr-pull

fullnameOverride: openai-dial-proxy

containerPorts:
  http: 8080

containerSecurityContext:
  readOnlyRootFilesystem: true

temporary:
  mountPath: /tmp
  sizeLimit: 64Mi

env:
  TMPDIR: /tmp
  DIAL_UPSTREAM: "http://dial-core.dial.svc.cluster.local"
  DEFAULT_API_VERSION: "2024-10-21"
  REQUEST_TIMEOUT: "900"
  MODELS_UPSTREAM_PATH: "/openai/models"

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true

ingress:
  enabled: false

httpRoute:
  enabled: true
  hostnames:
    - dial.example.com
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      timeouts:
        request: 900s
      backendRefs:
        - name: openai-dial-proxy
          port: 80
    - matches:
        - path:
            type: Exact
            value: /v1/embeddings
      timeouts:
        request: 900s
      backendRefs:
        - name: openai-dial-proxy
          port: 80
    - matches:
        - path:
            type: Exact
            value: /v1/models
      backendRefs:
        - name: openai-dial-proxy
          port: 80
